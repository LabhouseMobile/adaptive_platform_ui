name: Create new Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.0.2 or 1.0.1-lh6)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare release
        id: prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          BRANCH="release/v$VERSION"
          git check-ref-format --branch "$BRANCH"
          git switch -c "$BRANCH"
          python3 scripts/prepare_release.py "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit and push release branch
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pubspec.yaml
          git commit -m "chore: release $VERSION"
          git push --set-upstream origin "$BRANCH"

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh label create "Release" --color 0E8A16 \
            --description "Merging this PR tags and publishes a GitHub release" --force
          LATEST_TAG=$(git describe --tags --abbrev=0)
          COMPARE_URL="$SERVER_URL/$REPOSITORY/compare/$LATEST_TAG...$BRANCH"
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          BODY=$(printf 'Prepared release v%s.\n\nChanges since [`%s`](%s).\n\nMerging this PR tags `v%s` and creates the GitHub release.' \
            "$VERSION" "$LATEST_TAG" "$COMPARE_URL" "$VERSION")
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: release $VERSION" \
            --body "$BODY" \
            --label "Release"
